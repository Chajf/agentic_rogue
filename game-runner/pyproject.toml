[project]
name = "game-runner"
version = "0.1.0"
description = "Rogue agent session runner"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["game_runner*"]
