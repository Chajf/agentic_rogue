[project]
name = "agentic-rogue"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["rogue-env", "game-runner"]

[dependency-groups]
test = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["rogue-env/tests", "game-runner/tests"]
